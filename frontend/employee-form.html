<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee · HRMS</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="employees" data-title="Add employee" data-subtitle="All fields marked * are required">
<main id="content" hidden>
    <a href="/employees" class="small muted" style="display:inline-block;margin-bottom:14px">← Back to employees</a>
    <div class="alert alert-error hidden" id="formError" role="alert"></div>
    <form id="employeeForm" novalidate>
        <div class="split">
            <div>
                <div class="card mb"><div class="card-body">
                    <p class="form-section">Personal information</p>
                    <div class="form-grid">
                        <div class="field"><label>Employee ID</label><input id="employee_code" value="Generated automatically" disabled></div>
                        <div class="field"><label for="first_name">First name <span class="req">*</span></label>
                            <input id="first_name" name="first_name" maxlength="60"><small class="error-text" data-error-for="first_name"></small></div>
                        <div class="field"><label for="last_name">Last name <span class="req">*</span></label>
                            <input id="last_name" name="last_name" maxlength="60"><small class="error-text" data-error-for="last_name"></small></div>
                        <div class="field"><label for="gender">Gender <span class="req">*</span></label>
                            <select id="gender" name="gender"><option value="">Select…</option></select><small class="error-text" data-error-for="gender"></small></div>
                        <div class="field"><label for="date_of_birth">Date of birth <span class="req">*</span></label>
                            <input type="date" id="date_of_birth" name="date_of_birth"><small class="error-text" data-error-for="date_of_birth"></small>
                            <small class="hint" id="ageHint"></small></div>
                        <div class="field"><label for="cnic">CNIC <span class="req">*</span></label>
                            <input id="cnic" name="cnic" placeholder="12345-1234567-1" maxlength="15"><small class="error-text" data-error-for="cnic"></small></div>
                        <div class="field"><label for="email">Email <span class="req">*</span></label>
                            <input type="email" id="email" name="email" maxlength="100"><small class="error-text" data-error-for="email"></small></div>
                        <div class="field"><label for="phone">Phone <span class="req">*</span></label>
                            <input type="tel" id="phone" name="phone" placeholder="+92 300 1234567"><small class="error-text" data-error-for="phone"></small></div>
                    </div>
                </div></div>
                <div class="card"><div class="card-body">
                    <p class="form-section">Employment information</p>
                    <div class="form-grid">
                        <div class="field"><label for="department_id">Department <span class="req">*</span></label>
                            <select id="department_id" name="department_id"><option value="">Select…</option></select><small class="error-text" data-error-for="department_id"></small></div>
                        <div class="field"><label for="designation">Designation <span class="req">*</span></label>
                            <input id="designation" name="designation" placeholder="e.g. Software Engineer"><small class="error-text" data-error-for="designation"></small></div>
                        <div class="field"><label for="hire_date">Hire date <span class="req">*</span></label>
                            <input type="date" id="hire_date" name="hire_date"><small class="error-text" data-error-for="hire_date"></small>
                            <small class="hint" id="hireHint"></small></div>
                        <div class="field"><label for="employment_type">Employment type <span class="req">*</span></label>
                            <select id="employment_type" name="employment_type"><option value="">Select…</option></select><small class="error-text" data-error-for="employment_type"></small></div>
                        <div class="field"><label for="salary">Monthly salary <span class="req">*</span></label>
                            <input type="number" id="salary" name="salary" min="0" step="0.01"><small class="error-text" data-error-for="salary"></small>
                            <small class="hint" id="wageHint"></small></div>
                        <div class="field"><label for="status">Status</label>
                            <select id="status" name="status"></select><small class="error-text" data-error-for="status"></small></div>
                    </div>
                </div></div>
            </div>
            <div class="card"><div class="card-body">
                <p class="form-section">Hiring rules</p>
                <div id="rulesSummary" class="small"></div>
                <div class="form-actions" style="justify-content:stretch;flex-direction:column;margin-top:18px">
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save employee</button>
                    <a href="/employees" class="btn btn-light">Cancel</a>
                </div>
            </div></div>
        </div>
    </form>
</main>
<script src="/js/api.js"></script><script src="/js/layout.js"></script><script src="/js/validation.js"></script>
<script>
    const form = document.getElementById('employeeForm');
    const id = new URLSearchParams(location.search).get('id');
    let rules;

    function updateHints() {
        const dob = Validation.parseIso(form.date_of_birth.value);
        const hire = Validation.parseIso(form.hire_date.value);
        const ageHint = document.getElementById('ageHint');
        if (dob && hire) {
            const age = Validation.ageOn(dob, hire);
            const ok = age >= rules.minAge && age <= rules.maxAge;
            ageHint.textContent = `Age on hire date: ${age} (allowed ${rules.minAge}–${rules.maxAge})`;
            ageHint.className = 'hint ' + (ok ? 'ok' : 'bad');
        } else {
            ageHint.textContent = `Must be ${rules.minAge}–${rules.maxAge} years old on the hire date`;
            ageHint.className = 'hint';
        }
        const type = form.employment_type.value;
        const wageHint = document.getElementById('wageHint');
        if (rules.minWage[type] !== undefined) {
            const salary = Number(form.salary.value);
            const ok = form.salary.value !== '' && salary >= rules.minWage[type];
            wageHint.textContent = `Minimum wage for ${type}: ${money(rules.minWage[type], rules.currency)}`;
            wageHint.className = 'hint ' + (form.salary.value === '' ? '' : ok ? 'ok' : 'bad');
        } else {
            wageHint.textContent = 'Choose an employment type to see its minimum wage';
            wageHint.className = 'hint';
        }
    }

    form.addEventListener('input', updateHints);
    form.addEventListener('change', updateHints);

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        document.getElementById('formError').classList.add('hidden');
        const data = formData(form);
        const errors = Validation.employee(data, rules, todayIso());
        showErrors(form, errors);
        if (Object.keys(errors).length) {
            const box = document.getElementById('formError');
            box.textContent = `Please correct the ${Object.keys(errors).length} highlighted field(s).`;
            box.classList.remove('hidden');
            return;
        }
        const button = document.getElementById('saveBtn');
        button.disabled = true;
        try {
            const saved = await api(id ? 'PUT' : 'POST', id ? `/api/employees/${id}` : '/api/employees', data);
            flash(`${saved.full_name} (${saved.employee_code}) was ${id ? 'updated' : 'added'} successfully`);
            window.location.href = '/employees';
        } catch (e) {
            showErrors(form, e.errors);
            const box = document.getElementById('formError');
            box.textContent = e.errors && e.errors.form ? e.errors.form : e.message;
            box.classList.remove('hidden');
            button.disabled = false;
        }
    });

    (async () => {
        if (!await initPage()) return;
        rules = await loadRules();
        const fill = (select, values) => { select.innerHTML += values.map(v => `<option>${esc(v)}</option>`).join(''); };
        fill(form.gender, rules.genders);
        fill(form.employment_type, rules.employmentTypes);
        form.status.innerHTML = rules.employeeStatuses.map(v => `<option>${esc(v)}</option>`).join('');
        const departments = await api('GET', '/api/departments');
        form.department_id.innerHTML += departments.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
        form.hire_date.min = rules.companyFounded;
        form.hire_date.max = Validation.addDays(todayIso(), rules.maxHireDaysAhead);
        form.date_of_birth.max = todayIso();
        document.getElementById('hireHint').textContent =
            `Between ${formatDate(rules.companyFounded)} and ${rules.maxHireDaysAhead} days from today`;
        document.getElementById('rulesSummary').innerHTML = `
            <div class="list-item">Age on hire date<strong style="margin-left:auto">${rules.minAge}–${rules.maxAge}</strong></div>
            ${Object.entries(rules.minWage).map(([t, w]) => `<div class="list-item">Minimum wage (${t})<strong style="margin-left:auto">${money(w, rules.currency)}</strong></div>`).join('')}
            <div class="list-item">Earliest hire date<strong style="margin-left:auto">${formatDate(rules.companyFounded)}</strong></div>
            <div class="list-item">Latest hire date<strong style="margin-left:auto">today + ${rules.maxHireDaysAhead} days</strong></div>
            <div class="list-item">Email and CNIC<strong style="margin-left:auto">must be unique</strong></div>`;

        if (id) {
            document.getElementById('pageTitle').textContent = 'Edit employee';
            document.title = 'Edit employee · HRMS';
            try {
                const e = await api('GET', `/api/employees/${id}`);
                for (const key of ['first_name', 'last_name', 'gender', 'date_of_birth', 'cnic', 'email', 'phone',
                    'department_id', 'designation', 'hire_date', 'employment_type', 'salary', 'status']) {
                    form[key].value = e[key];
                }
                document.getElementById('employee_code').value = e.employee_code;
            } catch (err) {
                flash(err.message, 'error');
                window.location.href = '/employees';
                return;
            }
        }
        updateHints();
    })();
</script>
</body>
</html>
